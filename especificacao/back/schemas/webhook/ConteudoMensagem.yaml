type: object
description: >
  Conteúdo da mensagem em objeto. gateway também envia `content` como string
  (mesmo texto de body); o Java aceita os dois formatos.
properties:
  body:
    type: string
    description: Texto da mensagem
    example: "Olá, gostaria de reservar"
  conversation:
    type: string
    description: Texto alternativo no formato aninhado Baileys
    example: "Olá, gostaria de reservar"

type: object
description: >
  Payload tipado recebido do WPPConnect via webhook. Aceita o formato plano (from/body),
  o aninhado (data.key / data.message) e os tipos mistos do Node (id/sender/content
  ora string, ora objeto).
additionalProperties: true
properties:
  session:
    type: string
    description: Nome da sessão WPPConnect da empresa
    example: sessao_recanto_01
  type:
    type: string
    description: Tipo da mensagem
    example: chat
  fromMe:
    type: boolean
    description: Indica se a mensagem foi enviada pelo próprio número conectado (dono do bot)
    example: false
  timestamp:
    type: integer
    format: int64
    description: Timestamp Unix da mensagem em segundos ou milissegundos. Mensagens com atraso superior a 2 minutos são descartadas como antigas.
    example: 1730592000
  to:
    type: string
    description: JID do destinatário no formato plano do WPPConnect (útil quando enviada pelo dono)
    example: 5511999999999@c.us
  isGroupMsg:
    type: boolean
    description: Indica se a mensagem veio de um grupo (WPPConnect). Ausente ou false em chats privados, inclusive os que usam JID @lid.
    example: false
  from:
    type: string
    description: JID do remetente no formato plano do WPPConnect
    example: 5511999999999@c.us
  body:
    type: string
    description: Texto da mensagem no formato plano do WPPConnect
    example: "Olá, gostaria de reservar"
  remoteJid:
    type: string
    description: JID do remetente quando informado no topo do payload
    example: 5511999999999@c.us
  sender:
    description: >
      Remetente. String com JID ou objeto Contact do WPPConnect
      (`sender.id` pode ser string ou Wid com `_serialized`).
    oneOf:
      - type: string
        example: 5511999999999@c.us
      - $ref: "#/components/schemas/RemetenteWebhook"
  event:
    type: string
    description: Evento do WPPConnect quando não é mensagem de chat (qrcode, status-find, onack)
    example: qrcode
  qrcode:
    type: string
    description: Base64 do QR Code enviado no webhook de conexão
  urlcode:
    type: string
    description: Conteúdo bruto do QR Code (urlcode) quando o WPPConnect envia o evento qrcode
  id:
    description: >
      Identificador da mensagem. String serializada nos eventos onmessage/onpresencechanged
      (ex. false_jid_hash ou 40308586844379@lid) ou objeto Baileys no evento onack.
    oneOf:
      - type: string
        example: false_5511999999999@c.us_3AE7951B92607B7B73F8
      - $ref: "#/components/schemas/IdentificadorMensagem"
  data:
    $ref: "#/components/schemas/DadosWebhook"
  content:
    description: Texto da mensagem como string (WPPConnect) ou objeto com body
    oneOf:
      - type: string
        example: "Olá, gostaria de reservar"
      - $ref: "#/components/schemas/ConteudoMensagem"

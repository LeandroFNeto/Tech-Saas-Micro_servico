type: object
description: Resumo do contato de uma empresa com telefone mascarado.
properties:
  id:
    type: integer
    format: int64
    description: Identificador do contato
    example: 1
  nome:
    type: string
    nullable: true
    description: Nome do contato quando conhecido
    example: "João Silva"
  telefoneMascarado:
    type: string
    description: Telefone mascarado para proteção de dados
    example: "(11) *****-1234"
  primeiraConversaEm:
    type: string
    format: date-time
    nullable: true
    description: Data e hora do primeiro contato
    example: "2026-10-01T10:00:00"
  ultimaConversaEm:
    type: string
    format: date-time
    nullable: true
    description: Data e hora da última conversa
    example: "2026-10-28T15:30:00"
  naoContatar:
    type: boolean
    description: Indica se o contato solicitou parar o recebimento de mensagens
    example: false
  origem:
    type: string
    enum:
      - CONVERSA
      - AGENDA
    description: Origem de registro do contato
    example: CONVERSA

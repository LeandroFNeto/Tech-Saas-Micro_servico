type: object
description: Credenciais enviadas no POST /auth/login. Não expõe entidade JPA.
properties:
  email:
    type: string
    format: email
    description: E-mail cadastrado do usuário
    example: usuario@gamb.com
  senha:
    type: string
    format: password
    description: Senha em texto puro; o servidor compara com o hash BCrypt
    example: SenhaMaster123
required:
  - email
  - senha

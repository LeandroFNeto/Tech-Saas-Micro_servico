type: object
description: Status da sessão WhatsApp no gateway, exposto ao painel sem vazar token interno.
properties:
  sessao:
    type: string
    description: Identificador da sessão no gateway
    example: sessao_recanto_01
  status:
    type: string
    description: Estado normalizado para o front-end. INITIALIZING indica reconexão com credenciais válidas, sem QR.
    enum:
      - CONNECTED
      - QRCODE
      - INITIALIZING
      - DISCONNECTED
    example: QRCODE
  qrcodeBase64:
    type: string
    nullable: true
    description: Imagem do QR Code em Data URL ou Base64, presente apenas quando status é QRCODE
    example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
  sessaoEncerrada:
    type: boolean
    default: false
    description: Verdadeiro só quando status é DISCONNECTED e o servidor registrou que a conexão pareada foi encerrada (aparelho desvinculado ou sessão inválida), exigindo novo pareamento. Ausente ou falso em qualquer outro caso, inclusive gateway antigo.
    example: false
required:
  - sessao
  - status

type: object
description: Contrato de atualização do painel do cliente (PUT). Não inclui campos de cobrança ou infraestrutura.
properties:
  nome:
    type: string
    description: Nome fantasia
    example: Recanto Vista Alegre
  mensagemSaudacao:
    type: string
    maxLength: 1000
    description: Mensagem que o bot envia ao iniciar a conversa. Máximo de 1000 caracteres para evitar bloqueios por spam.
    example: Olá! Como posso ajudar?
  tabelaDePrecos:
    type: string
    maxLength: 1000
    description: Mensagem de preços que o bot envia no WhatsApp quando o cliente pede a tabela. Máximo de 1000 caracteres.
    example: "Diária padrão: R$ 500,00"
  linkGoogleMaps:
    type: string
    description: Link do Google Maps do estabelecimento
    example: https://maps.app.goo.gl/exemplo
  linkFotoPrincipal:
    type: string
    description: URL pública da foto principal (Hero Image) hospedada no Cloudinary
    example: "https://res.cloudinary.com/demo/image/upload/v1/hero_image.jpg"
  urlsGaleria:
    type: array
    description: Lista de URLs públicas das fotos complementares hospedadas no Cloudinary
    maxItems: 5
    items:
      type: string
    example:
      - "https://res.cloudinary.com/demo/image/upload/v1/foto1.jpg"
      - "https://res.cloudinary.com/demo/image/upload/v1/foto2.jpg"
  linkGaleria:
    type: string
    description: Link opcional da galeria completa no Google Drive (fotos e vídeos em alta qualidade)
    example: "https://drive.google.com/drive/folders/exemplo"
  permiteReservaAutomatica:
    type: boolean
    description: Somente leitura para o cliente. Valor igual ao atual é ignorado; valor diferente responde 400 e nada é gravado. Quem liga ou desliga é o admin.
    default: false
    example: false
  locacaoPorHora:
    type: boolean
    description: Define se o local é alugado por hora (true) ou por diária (false)
    default: false
    example: false
  regrasLocacao:
    type: string
    maxLength: 1000
    description: Regras do local e política de cancelamento lidas pelo bot. Máximo de 1000 caracteres.
    example: "Cancelar com 5 dias de antecedência"
  modulosMenu:
    type: array
    description: Opções do menu do WhatsApp (Fotos, Localização, Preços, Regras, Reserva). O cliente liga, desliga e edita o texto_menu.
    items:
      $ref: ./ModuloMenuDTO.yaml
  cidadePrevisao:
    type: string
    maxLength: 100
    description: Cidade do espaço para a previsão do tempo. Ao mudar, o back geocodifica o centro da cidade (400 se não achar, 429 após 5 trocas no dia, 503 se o provedor estiver fora).
    example: Atibaia
  previsaoTempoAtiva:
    type: boolean
    description: Interruptor "Mostrar previsão do tempo". Desligado por padrão.
    default: false
    example: false
  lembreteConfirmacao:
    $ref: ./LembreteConfirmacaoDTO.yaml

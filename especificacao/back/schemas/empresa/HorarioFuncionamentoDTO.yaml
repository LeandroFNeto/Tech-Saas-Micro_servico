type: object
description: Horário de funcionamento de um perfil, que é um dia da semana ou FERIADO.
properties:
  perfil:
    type: string
    enum: [SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO, DOMINGO, FERIADO]
    example: SABADO
  fechado:
    type: boolean
    description: Se a empresa não abre neste perfil
    example: false
  abre:
    type: string
    description: Hora de abertura, HH:mm. Obrigatória quando não está fechado
    example: "10:00"
  fecha:
    type: string
    description: Hora de fechamento, HH:mm. Aceita "24:00" para indicar meia-noite. Obrigatória quando não está fechado
    example: "22:00"
  duracaoMinutos:
    type: integer
    format: int32
    nullable: true
    description: Duração do atendimento neste perfil. Vazio herda a da empresa
    example: 120

    codigoAcao:
      type: string
    textoMenu:
      type: string
    ordemExibicao:
      type: integer
      format: int32
    ativo:
      type: boolean
PagedModelEntityModelEmpresa:
  type: object
  properties:
    _embedded:
      type: object
      properties:
        empresas:

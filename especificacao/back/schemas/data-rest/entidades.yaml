Empresa:
  type: object
  properties:
    id:
      type: integer
      format: int64
    nome:
      type: string
    usaIA:
      type: boolean
    sessaoWhatsapp:
      type: string
    mensagemSaudacao:
      type: string
    ramoDeAtuacao:
      type: string
    tabelaDePrecos:
      type: string
    regrasLocacao:
      type: string
    linkGoogleMaps:
      type: string
    linkFotoPrincipal:
      type: string
    urlsGaleria:
      type: array
      maxItems: 5
      items:
        type: string
    linkGaleria:
      type: string
    googleCalendarId:
      type: string
      nullable: true
      description: Só o admin recebe o valor. Para o cliente vem nulo.
    locacaoPorHora:
      type: boolean
    permiteReservaAutomatica:
      type: boolean
      default: false
    modulosAtivos:
      type: array
      items:
        $ref: "#/components/schemas/ModuloEmpresa"

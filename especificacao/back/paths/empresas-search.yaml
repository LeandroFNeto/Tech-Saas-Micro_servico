get:
  tags:
  - Gerenciamento de Empresas
  - empresa-search-controller
  summary: Buscar empresa pela sessão WhatsApp
  description: Usado pelo painel admin e pelo perfil do cliente. Admin lê qualquer empresa e recebe googleCalendarId. Cliente (JWT) lê só a própria empresa e googleCalendarId vem nulo.
  operationId: executeSearch-empresa-get
  parameters:
  - name: x-admin-token
    in: header
    description: Token administrativo do SaaS
    required: false
    schema:
      type: string
    example: sua-chave-admin
  - name: sessaoWhatsapp
    in: query
    required: true
    schema:
      type: string
    example: sessao_recanto_01
  responses:
    "200":
      description: OK
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EntityModelEmpresa"
    "401":
      description: Token administrativo ou de cliente inválido
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EntityModelEmpresa"
    "403":
      description: Cliente de outra empresa ou sessão inexistente para quem não é admin
    "404":
      description: Empresa não encontrada para a sessão informada (só para o admin)

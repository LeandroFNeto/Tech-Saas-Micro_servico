get:
  tags:
  - Conexão WhatsApp
  summary: Consultar status da sessão WhatsApp
  description: O Java consulta o WPPConnect (GET /api/{sessao}/status-session) e devolve SessaoStatusResponseDTO. Não expõe o token interno do WPPConnect.
  operationId: consultarStatusSessao
  parameters:
  - name: x-admin-token
    in: header
    description: Token administrativo do SaaS
    required: false
    schema:
      type: string
    example: sua-chave-admin
  - name: sessao
    in: path
    description: Identificador da sessão WhatsApp da empresa
    required: true
    schema:
      type: string
    example: sessao_recanto_01
  responses:
    "200":
      description: Status atual da sessão
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessaoStatusResponseDTO"
    "401":
      description: Token administrativo ou de cliente inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessaoStatusResponseDTO"
    "403":
      description: Cliente tentando acessar sessão de outra empresa ou inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessaoStatusResponseDTO"
    "404":
      description: Empresa não encontrada para a sessão informada (só para o admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessaoStatusResponseDTO"

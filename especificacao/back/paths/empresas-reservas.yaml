get:
  tags:
  - Gerenciamento de Reservas
  summary: Listar reservas da empresa
  description: Lista as reservas da empresa dos próximos dias (padrão 30, de 1 a 60). Sincroniza com a Google Agenda se passaram mais de 5 minutos da última sincronização. Apenas o cliente da própria empresa pode acessar (admin recebe 403).
  operationId: listarReservas
  parameters:
  - name: sessao
    in: path
    description: Identificador da sessão WhatsApp da empresa
    required: true
    schema:
      type: string
    example: sessao_recanto_01
  - name: dias
    in: query
    description: Quantidade de dias futuros para listar reservas (1 a 60)
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 60
      default: 30
    example: 30
  responses:
    "200":
      description: Lista de reservas retornada com sucesso
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ReservaResumoDTO"
    "401":
      description: Sem token de autenticação
    "403":
      description: Acesso negado (admin ou cliente de outra empresa)
    "404":
      description: Empresa não encontrada para a sessão informada

post:
  tags:
    - Autenticação
  summary: Autenticar usuário e emitir JWT
  description: Valida e-mail e senha (BCrypt) e devolve LoginResponseDTO. Rota pública.
  operationId: login
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/LoginRequestDTO"
  responses:
    "200":
      description: Autenticação bem-sucedida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginResponseDTO"
    "401":
      description: E-mail ou senha inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroDTO"
    "429":
      description: Mais de 5 falhas de login do mesmo e-mail e IP em 15 minutos
      headers:
        Retry-After:
          description: Segundos até a janela de tentativas passar
          schema:
            type: integer
            example: 600
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroDTO"

put:
  tags:
  - Gerenciamento de Empresas
  summary: Atualizar perfil pelo cliente
  description: "Aplica EmpresaUpdateDTO: textos, links, aparência, cidade da previsão e interruptor da previsão. Não altera cobrança nem infraestrutura."
  operationId: atualizarPeloCliente
  parameters:
  - name: sessao
    in: path
    description: Identificador da sessão WhatsApp da empresa
    required: true
    schema:
      type: string
    example: sessao_recanto_01
  requestBody:
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/EmpresaUpdateDTO"
    required: true
  responses:
    "200":
      description: Perfil do cliente atualizado
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EmpresaResponseDTO"
    "400":
      description: Cidade não encontrada. Confira o nome da cidade. Também responde 400 com "A reserva automática é liberada pelo administrador." quando permiteReservaAutomatica vem com valor diferente do atual; nada é gravado.
    "403":
      description: Só o admin ou o cliente da própria empresa. Cliente de outra empresa e sessão inexistente (para quem não é admin) recebem 403 antes de qualquer escrita ou consumo de cota.
    "429":
      description: Muitas alterações de cidade hoje. Tente amanhã. (limite de 5 trocas por empresa por dia)
    "503":
      description: Não foi possível verificar a cidade agora. Tente novamente em alguns minutos. Nada é gravado e a troca não conta no limite diário.
    "404":
      description: Empresa não encontrada para a sessão informada (só para o admin)
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EmpresaResponseDTO"

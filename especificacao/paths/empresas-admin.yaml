put:
  tags:
  - Gerenciamento de Empresas
  summary: Atualizar infraestrutura pelo admin
  description: "Aplica EmpresaUpdateAdminDTO: sessão, tipo de locação, ID da agenda Google e módulos. Uso restrito ao administrador do SaaS."
  operationId: atualizarPeloAdmin
  parameters:
  - name: x-admin-token
    in: header
    description: Token administrativo do SaaS
    required: false
    schema:
      type: string
    example: sua-chave-admin
  - name: sessao
    in: path
    description: Identificador da sessão WhatsApp da empresa
    required: true
    schema:
      type: string
    example: sessao_recanto_01
  requestBody:
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/EmpresaUpdateAdminDTO"
    required: true
  responses:
    "200":
      description: Infraestrutura atualizada
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EmpresaResponseDTO"
    "401":
      description: Token administrativo inválido
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EmpresaResponseDTO"
    "404":
      description: Empresa não encontrada para a sessão informada
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/EmpresaResponseDTO"

type: object
description: Contrato de atualização do painel do cliente (PUT). Não inclui campos de cobrança ou infraestrutura.
properties:
  nome:
    type: string
    description: Nome fantasia
    example: Recanto Vista Alegre
  mensagemSaudacao:
    type: string
    description: Mensagem que o bot envia ao iniciar a conversa
    example: Olá! Como posso ajudar?
  tabelaDePrecos:
    type: string
    description: Mensagem de preços que o bot envia no WhatsApp quando o cliente pede a tabela
    example: "Diária padrão: R$ 500,00"
  linkGoogleMaps:
    type: string
    description: Link do Google Maps do estabelecimento
    example: https://maps.app.goo.gl/exemplo
  linkFotoPrincipal:
    type: string
    description: URL pública da foto principal (Hero Image) hospedada no Cloudinary
    example: "https://res.cloudinary.com/demo/image/upload/v1/hero_image.jpg"
  urlsGaleria:
    type: array
    description: Lista de URLs públicas das fotos complementares hospedadas no Cloudinary
    maxItems: 5
    items:
      type: string
    example:
      - "https://res.cloudinary.com/demo/image/upload/v1/foto1.jpg"
      - "https://res.cloudinary.com/demo/image/upload/v1/foto2.jpg"
  linkGaleria:
    type: string
    description: Link opcional da galeria completa no Google Drive (fotos e vídeos em alta qualidade)
    example: "https://drive.google.com/drive/folders/exemplo"
  permiteReservaAutomatica:
    type: boolean
    description: Ativa ou desativa a reserva automática pelo bot no WhatsApp
    default: false
    example: false
  locacaoPorHora:
    type: boolean
    description: Define se o local é alugado por hora (true) ou por diária (false)
    default: false
    example: false
  regrasLocacao:
    type: string
    description: Regras do local e política de cancelamento lidas pelo bot
    example: "Cancelar com 5 dias de antecedência"
  modulosMenu:
    type: array
    description: Opções do menu do WhatsApp (Fotos, Localização, Preços, Regras, Reserva). O cliente liga, desliga e edita o texto_menu.
    items:
      $ref: ./ModuloMenuDTO.yaml

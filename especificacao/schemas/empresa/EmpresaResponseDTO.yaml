type: object
description: Contrato de saída da API de empresas. Não expõe a entidade JPA nem campos internos de infraestrutura.
properties:
  id:
    type: integer
    format: int64
    description: Identificador único da empresa
    example: 1
  nome:
    type: string
    description: Nome fantasia
    example: Recanto Vista Alegre
  sessaoWhatsapp:
    type: string
    description: Identificador da sessão no WPPConnect, usado pelo front-end para acompanhar a conexão
    example: sessao_recanto_01
  statusSessao:
    type: string
    description: Status atual da sessão WhatsApp
    example: DISCONNECTED
  linkGoogleMaps:
    type: string
    description: Link configurado para o Google Maps
    example: https://maps.app.goo.gl/exemplo
  linkFotoPrincipal:
    type: string
    description: URL pública da foto principal (Hero Image) hospedada no Cloudinary
    example: "https://res.cloudinary.com/demo/image/upload/v1/hero_image.jpg"
  urlsGaleria:
    type: array
    description: Lista de URLs públicas das fotos complementares hospedadas no Cloudinary
    maxItems: 5
    items:
      type: string
    example:
      - "https://res.cloudinary.com/demo/image/upload/v1/foto1.jpg"
      - "https://res.cloudinary.com/demo/image/upload/v1/foto2.jpg"
  linkGaleria:
    type: string
    description: Link opcional da galeria completa no Google Drive (fotos e vídeos em alta qualidade)
    example: "https://drive.google.com/drive/folders/exemplo"
  permiteReservaAutomatica:
    type: boolean
    description: Quando true, o bot exibe a opção de reserva automática no WhatsApp
    default: false
    example: false
  locacaoPorHora:
    type: boolean
    description: Define se o local é alugado por hora (true) ou por diária (false)
    default: false
    example: false
  regrasLocacao:
    type: string
    description: Regras do local e política de cancelamento lidas pelo bot
    example: "Cancelar com 5 dias de antecedência"
  modulosMenu:
    type: array
    description: Opções do menu do WhatsApp configuradas pelo cliente
    items:
      $ref: ./ModuloMenuDTO.yaml
  atualizadoEm:
    type: string
    format: date-time
    description: Data e hora da última modificação retornada pela API
    example: 2026-09-03T14:30:00

type: object
description: Contrato de entrada para cadastrar uma nova empresa no SaaS (POST)
properties:
  nome:
    type: string
    description: Nome fantasia do estabelecimento
    example: Recanto Vista Alegre
  sessaoWhatsapp:
    type: string
    description: Identificador único da sessão no WPPConnect
    example: sessao_recanto_01
  ramoDeAtuacao:
    type: string
    description: Ramo de atuação usado para escolher a estratégia de atendimento
    example: locacao
  precoBase:
    type: number
    format: double
    description: Preço base de referência da locação
    example: 500.0
  googleCalendarId:
    type: string
    description: ID da agenda Google desta empresa (não usar valor global no .env)
    example: abc123@group.calendar.google.com
  permiteReservaAutomatica:
    type: boolean
    description: Quando true, o bot já nasce com a reserva automática habilitada no WhatsApp
    default: false
    example: false
  linkFotoPrincipal:
    type: string
    description: URL pública da foto principal (Hero Image) hospedada no Cloudinary
    example: "https://res.cloudinary.com/demo/image/upload/v1/hero_image.jpg"
  urlsGaleria:
    type: array
    description: Lista de URLs públicas das fotos complementares hospedadas no Cloudinary
    maxItems: 5
    items:
      type: string
    example:
      - "https://res.cloudinary.com/demo/image/upload/v1/foto1.jpg"
      - "https://res.cloudinary.com/demo/image/upload/v1/foto2.jpg"
  email:
    type: string
    format: email
    description: >
      E-mail de acesso do cliente. O servidor ignora o valor enviado e força
      sessaoWhatsapp (minúsculas, sem espaços) + "@gamb.com.br".
    example: sessao_recanto_01@gamb.com.br
  senha:
    type: string
    format: password
    writeOnly: true
    minLength: 6
    description: Senha inicial do cliente; o servidor persiste apenas o hash BCrypt
    example: SenhaCliente123
  modulosIniciais:
    type: array
    description: Módulos liberados na criação da empresa
    example:
    - IA_GEMINI
    - GOOGLE_CALENDAR
    items:
      type: string
required:
- nome
- sessaoWhatsapp
- senha

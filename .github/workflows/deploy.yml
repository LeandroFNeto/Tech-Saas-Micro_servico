name: CI/CD Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  testar:
    name: Executar Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar Testes Backend
        run: mvn clean test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias Frontend
        run: npm --prefix frontend ci

      - name: Executar Testes Frontend
        run: npm --prefix frontend test -- --watch=false --browsers=ChromeHeadlessCustom

  deploy:
    name: Deploy no VPS Hostinger via SSH
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '72.62.117.106' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.GAMB_SERVER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            CAMINHO=""
            for dir in "$HOME/gamb" "/gamb" "/root/gamb" "/app/Tech-Saas-Micro_servico" "$HOME/Tech-Saas-Micro_servico"; do
              if [ -d "$dir" ]; then
                CAMINHO="$dir"
                break
              fi
            done

            if [ -n "$CAMINHO" ]; then
              echo "Diretorio encontrado: $CAMINHO"
              cd "$CAMINHO"
              git fetch origin main
              git reset --hard origin/main
              chmod +x "scripts/deploy-hostinger.sh"
              bash "scripts/deploy-hostinger.sh"
            else
              echo "Pasta do projeto (gamb) nao encontrada!" && exit 1
            fi

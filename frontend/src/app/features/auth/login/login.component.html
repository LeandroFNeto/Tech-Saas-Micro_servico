<div [class]="design.pagina">
  <section [class]="design.marca.faixa">
    <div aria-hidden="true" [class]="design.marca.brilho"></div>

    <a routerLink="/" [class]="design.marca.link + ' ' + design.foco">
      <img src="logo-gamb.png" [alt]="conteudo.marca.logoAlt" width="96" height="96" [class]="design.marca.logo" />
      <span [class]="design.marca.nome">{{ conteudo.marca.nome }}</span>
    </a>

    <div [class]="design.marca.texto">
      <h1 [class]="design.marca.titulo">{{ conteudo.marca.titulo }}</h1>
      <p [class]="design.marca.descricao">{{ conteudo.marca.descricao }}</p>
    </div>
  </section>

  <section [class]="design.area">
    <div [class]="design.cartao.caixa">
      <h2 [class]="design.cartao.titulo">{{ conteudo.cartao.titulo }}</h2>
      <p [class]="design.cartao.descricao">{{ conteudo.cartao.descricao }}</p>

      <form [class]="design.formulario" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <div>
          <label for="login-email" [class]="design.campo.rotulo">{{ conteudo.email.rotulo }}</label>
          <input
            id="login-email"
            [class]="design.campo.entrada"
            type="email"
            inputmode="email"
            formControlName="email"
            autocomplete="username"
            [placeholder]="conteudo.email.placeholder"
            [attr.aria-invalid]="emailInvalido"
            [attr.aria-describedby]="emailInvalido ? 'login-email-erro' : null"
          />
          @if (emailInvalido) {
            <p id="login-email-erro" role="alert" [class]="design.campo.erro">{{ conteudo.email.erro }}</p>
          }
        </div>

        <div>
          <label for="login-senha" [class]="design.campo.rotulo">{{ conteudo.senha.rotulo }}</label>
          <div [class]="design.campo.caixaSenha">
            <input
              id="login-senha"
              [class]="design.campo.entradaSenha"
              [type]="mostrarSenha() ? 'text' : 'password'"
              formControlName="senha"
              autocomplete="current-password"
              [placeholder]="conteudo.senha.placeholder"
            />
            <button
              type="button"
              [class]="design.campo.botaoMostrar + ' ' + design.foco"
              [attr.aria-label]="mostrarSenha() ? conteudo.senha.ocultarRotulo : conteudo.senha.mostrarRotulo"
              [attr.aria-pressed]="mostrarSenha()"
              aria-controls="login-senha"
              (click)="alternarSenha()"
            >
              {{ mostrarSenha() ? conteudo.senha.ocultar : conteudo.senha.mostrar }}
            </button>
          </div>
        </div>

        @if (erro) {
          <p role="alert" [class]="design.alertaErro">{{ erro }}</p>
        }

        <button [class]="design.botaoEntrar" type="submit" [disabled]="form.invalid || enviando">
          {{ enviando ? conteudo.botao.entrando : conteudo.botao.entrar }}
        </button>
      </form>

      <p [class]="design.cartao.ajuda">{{ conteudo.cartao.ajuda }}</p>
    </div>

    <a routerLink="/" [class]="design.linkVoltar + ' ' + design.foco">{{ conteudo.voltar }}</a>
  </section>
</div>

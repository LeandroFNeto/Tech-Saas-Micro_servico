<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-brand-900 px-4 py-12">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,_rgba(247,147,30,0.28),_transparent_52%)]"></div>
  <div class="pointer-events-none absolute -left-24 bottom-0 h-72 w-72 rounded-full bg-brand-500/20 blur-3xl"></div>

  <div class="relative w-full max-w-md rounded-3xl border border-white/10 bg-brand-800/70 p-8 shadow-2xl backdrop-blur-xl sm:p-10">
    <div class="flex flex-col items-center text-center">
      <img
        src="logo-gamb.jpg"
        alt="Logo gamb"
        class="h-20 w-20 rounded-2xl object-cover ring-1 ring-accent-400/50 shadow-lg shadow-accent-500/20"
      />
      <p class="mt-8 font-display text-xl font-semibold leading-snug text-white sm:text-2xl">
        Automatize tarefas repetitivas.<br />
        <span class="text-accent-400">O seu tempo é o seu maior ativo.</span>
      </p>
    </div>

    <form class="mt-10 space-y-5" [formGroup]="form" (ngSubmit)="entrar()">
      <label class="block text-left">
        <span class="mb-1.5 block text-sm font-medium text-brand-100">E-mail</span>
        <input
          class="input-field border-white/10 bg-brand-900/60 text-white placeholder:text-brand-300 focus:border-accent-400 focus:ring-accent-400/20"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="sessao@gamb.com.br"
        />
        @if (emailInvalido) {
          <small class="mt-1.5 block text-xs text-red-400">
            O e-mail de acesso deve ser o nome da sua sessão seguido de &#64;gamb.com.br
          </small>
        }
      </label>

      <label class="block text-left">
        <span class="mb-1.5 block text-sm font-medium text-brand-100">Senha</span>
        <input
          class="input-field border-white/10 bg-brand-900/60 text-white placeholder:text-brand-300 focus:border-accent-400 focus:ring-accent-400/20"
          type="password"
          formControlName="senha"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      @if (erro) {
        <p class="rounded-xl border border-red-400/30 bg-red-500/10 px-3 py-2 text-sm text-red-300" role="alert">
          {{ erro }}
        </p>
      }

      <button
        class="btn-primary w-full disabled:opacity-40"
        type="submit"
        [disabled]="form.invalid || enviando"
      >
        {{ enviando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>

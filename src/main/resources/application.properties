spring.application.name=demo

# Garante que o Spring vai rodar na 8080 (para bater com o Docker)
server.port=8080

# Chaves Administrativas
admin.api.key=${ADMIN_API_KEY}
api.auth.token=${API_AUTH_TOKEN}
admin.default.email=${ADMIN_DEFAULT_EMAIL:usuario@gamb.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:}
admin.senha-legada-a-bloquear=${SENHA_LEGADA_A_BLOQUEAR:}
jwt.secret=${JWT_SECRET_KEY}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Proxies confiaveis (IPs ou CIDR separados por virgula) cujo X-Forwarded-For e aceito
seguranca.proxies-confiaveis=${PROXIES_CONFIAVEIS:}

# Origens do frontend (Vercel / localhost). Lista separada por vírgula.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Configuracoes do gateway do WhatsApp
wppconnect.url=${WPPCONNECT_URL}
wppconnect.secret-key=${WPPCONNECT_SECRET_KEY}
wppconnect.webhook-url=${WPPCONNECT_WEBHOOK_URL:http://bot-java:8080/webhook/whatsapp}
wppconnect.webhook-secret=${WPPCONNECT_WEBHOOK_SECRET:}
wppconnect.restaurar-sessoes=${WPPCONNECT_RESTAURAR_SESSOES:true}

# Configuracoes de Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://db-bot:5432/${MEU_POSTGRES_DB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracoes da IA (Gemini)
gemini.api.url=
gemini.api.key=${GEMINI_API_KEY}
gemini.max-chamadas-por-minuto=${GEMINI_MAX_POR_MINUTO:15}
gemini.max-chamadas-por-dia=${GEMINI_MAX_POR_DIA:3000}
gemini.teto-gasto-diario-reais=${GEMINI_TETO_GASTO_DIARIO_REAIS:15.0}
gemini.preco-entrada-usd-por-milhao=${GEMINI_PRECO_ENTRADA:0.30}
gemini.preco-saida-usd-por-milhao=${GEMINI_PRECO_SAIDA:2.50}
gemini.cotacao-usd-brl=${GEMINI_COTACAO_USD_BRL:5.50}
gemini.custo-estimado-chamada-reais=${GEMINI_CUSTO_ESTIMADO_CHAMADA:0.005}
gemini.pausa-apos-429-segundos=${GEMINI_PAUSA_APOS_429:300}
gemini.cache-minutos=${GEMINI_CACHE_MINUTOS:360}

# Contato comercial da Gamb
gamb.contato.whatsapp=${GAMB_CONTATO_WHATSAPP:}

# Bot de WhatsApp da Gamb: limite diario por numero e numeros autorizados no bot de teste de modulos
gamb.atendente.limite-diario-mensagens=${GAMB_ATENDENTE_LIMITE_DIARIO:30}
gamb.teste-modulos.numeros-autorizados=${GAMB_TESTE_NUMEROS_AUTORIZADOS:}

# Configuracoes do Swagger / SpringDoc (Para a Engenharia Reversa)
springdoc.api-docs.enabled=${SWAGGER_HABILITADO:false}
springdoc.swagger-ui.enabled=${SWAGGER_HABILITADO:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Camada GraphQL exclusiva da IA. Nao altera as rotas REST do contrato.
spring.graphql.path=/api/ia-query
spring.graphql.graphiql.enabled=false

# Previsao do tempo (OpenWeather). A chave vem so de variavel de ambiente.
previsao.openweather.chave=${OPENWEATHER_API_KEY:}
previsao.openweather.url-base=${OPENWEATHER_URL_BASE:https://api.openweathermap.org}
previsao.openweather.timeout-ms=3000

# Protecao de contatos e retencao
contatos.cripto.chave=${CONTATOS_CHAVE_CRIPTO:}
contatos.indice.chave=${CONTATOS_CHAVE_INDICE:}
retencao.meses=${RETENCAO_MESES:12}

logging.level.root=INFO
logging.level.com.example.demo=INFO

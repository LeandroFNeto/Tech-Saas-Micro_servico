spring.application.name=demo

# Garante que o Spring vai rodar na 8080 (para bater com o Docker)
server.port=8080

# Chaves Administrativas
admin.api.key=${ADMIN_API_KEY}
api.auth.token=${API_AUTH_TOKEN}
admin.default.email=${ADMIN_DEFAULT_EMAIL:usuario@gamb.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:SenhaMaster123}
jwt.secret=${JWT_SECRET_KEY:SuaChaveSuperSecretaParaGerarOsTokensJWTDe32Caracteres}
server.error.include-message=always

# Origens do frontend (Vercel / localhost). Lista separada por vírgula.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Configuracoes do WPPConnect
wppconnect.url=${WPPCONNECT_URL}
wppconnect.secret-key=${WPPCONNECT_SECRET_KEY}
wppconnect.webhook-url=${WPPCONNECT_WEBHOOK_URL:http://bot-java:8080/webhook/whatsapp}
wppconnect.restaurar-sessoes=${WPPCONNECT_RESTAURAR_SESSOES:true}

# Configuracoes de Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://db-bot:5432/${MEU_POSTGRES_DB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracoes da IA (Gemini)
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent
gemini.api.key=${GEMINI_API_KEY}

# Configuracoes do Swagger / SpringDoc (Para a Engenharia Reversa)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method